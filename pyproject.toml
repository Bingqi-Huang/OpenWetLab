[project]
name = "wetlab"
version = "0.1.0"
description = "LLM agents operating an automated wet-lab island (real and virtual)"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "paho-mqtt>=2.2.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "simpy>=4.1.2",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "pytest>=8",
]

[project.scripts]
wetlab = "wetlab.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wetlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["wetlab"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top-level package hierarchy (app -> agents -> lab)"
type = "layers"
containers = ["wetlab"]
exhaustive = true
layers = [
    "(app)",
    "(agents)",
    "lab",
]

[[tool.importlinter.contracts]]
name = "Lab must not import LLM libraries"
type = "forbidden"
source_modules = ["wetlab.lab"]
forbidden_modules = [
    "langchain",
    "langchain_core",
    "langchain_openai",
    "langchain_deepseek",
    "langchain_anthropic",
    "langgraph",
    "openai",
    "anthropic",
]

[[tool.importlinter.contracts]]
name = "Lab five-layer downward architecture"
type = "layers"
containers = ["wetlab.lab"]
exhaustive = true
layers = [
    "(service)",
    "(protocol)",
    "(registry) : (snapshot) : (sim) : (mqtt)",
    "(lab) : safety : (materials)",
    "(store) : devices : backend : errors",
]

[[tool.importlinter.contracts]]
name = "sim and mqtt are mutually independent and only depend on devices, backend, errors"
type = "layers"
containers = ["wetlab.lab"]
layers = [
    "(registry) : (snapshot) : (lab) : safety : (materials) : (store)",
    "(sim) | (mqtt)",
]

[[tool.importlinter.contracts]]
name = "snapshot only depends on store and devices"
type = "layers"
containers = ["wetlab.lab"]
layers = [
    "(registry) : (sim) : (mqtt) : (lab) : safety : (materials) : backend : errors",
    "(snapshot)",
]

[[tool.importlinter.contracts]]
name = "Device folders are mutually independent"
type = "layers"
containers = ["wetlab.lab.devices"]
exhaustive = true
layers = [
    "gateway | pcr | shaker | arm | turntable | rack",
    "base",
]
